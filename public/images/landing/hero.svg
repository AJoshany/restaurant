<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <rect width="800" height="600" rx="24" fill="#fff7ed" />

  <!-- drink glass -->
  <g transform="translate(652 108)">
    <circle r="54" fill="#eff6ff" stroke="#3b82f6" stroke-width="6" />
    <rect x="-6" y="-70" width="12" height="40" rx="6" fill="#3b82f6" />
    <circle cx="-14" cy="-10" r="7" fill="#bfdbfe" />
    <circle cx="10" cy="14" r="5" fill="#bfdbfe" />
  </g>

  <!-- side bowl -->
  <g transform="translate(132 470)">
    <circle r="62" fill="#ffffff" stroke="#fed7aa" stroke-width="8" />
    <circle r="40" fill="#fdba74" />
    <circle cx="-10" cy="-8" r="9" fill="#16a34a" />
    <circle cx="12" cy="6" r="8" fill="#dc2626" />
  </g>

  <!-- fork -->
  <g transform="translate(118 300)" fill="#9ca3af">
    <rect x="-6" y="-10" width="12" height="190" rx="6" />
    <rect x="-22" y="-80" width="8" height="60" rx="4" />
    <rect x="-6" y="-84" width="8" height="64" rx="4" />
    <rect x="10" y="-80" width="8" height="60" rx="4" />
  </g>

  <!-- knife -->
  <g transform="translate(682 300)" fill="#9ca3af">
    <rect x="-6" y="40" width="12" height="150" rx="6" />
    <path d="M -10 -90 C 14 -70 14 10 -10 40 L -10 -90 Z" />
  </g>

  <!-- plate -->
  <g transform="translate(400 300)">
    <circle r="230" fill="#ffffff" stroke="#fed7aa" stroke-width="10" />
    <circle r="190" fill="#ffffff" stroke="#ffedd5" stroke-width="2" />

    <!-- rice / side -->
    <ellipse cx="-100" cy="70" rx="80" ry="48" fill="#fff7ed" stroke="#fed7aa" stroke-width="4" />

    <!-- main protein -->
    <ellipse cx="20" cy="-20" rx="130" ry="78" fill="#ea580c" />
    <ellipse cx="-10" cy="-45" rx="60" ry="18" fill="#c2410c" opacity="0.55" />
    <ellipse cx="60" cy="10" rx="50" ry="14" fill="#c2410c" opacity="0.45" />

    <!-- roasted veg -->
    <circle cx="110" cy="70" r="22" fill="#fb923c" />
    <circle cx="150" cy="40" r="16" fill="#16a34a" />
    <circle cx="125" cy="105" r="14" fill="#16a34a" />

    <!-- cherry tomatoes -->
    <circle cx="-40" cy="-70" r="11" fill="#dc2626" />
    <circle cx="-10" cy="-85" r="9" fill="#dc2626" />

    <!-- herb garnish -->
    <path d="M30 -70 q14 -16 30 -4 q-16 10 -30 4 Z" fill="#22c55e" />
    <path d="M60 -55 q14 -14 28 -2 q-14 10 -28 2 Z" fill="#22c55e" />
  </g>

  <!-- steam -->
  <g stroke="#fdba74" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M360 150 q-14 -24 0 -46 q14 -22 0 -46" />
    <path d="M410 140 q-14 -24 0 -46 q14 -22 0 -46" />
  </g>
</svg>
