<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <rect width="800" height="600" rx="24" fill="#ffedd5" />

  <!-- steam -->
  <g stroke="#fdba74" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M330 260 q-16 -30 0 -58 q16 -28 0 -58" />
    <path d="M400 246 q-16 -30 0 -58 q16 -28 0 -58" />
    <path d="M470 260 q-16 -30 0 -58 q16 -28 0 -58" />
  </g>

  <!-- pot -->
  <g transform="translate(400 390)">
